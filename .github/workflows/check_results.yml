# Reruns a few short samples with the pinned package versions and fails if
# the outputs differ from the files committed in predictions/.
name: Check results

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: set_up.py

      - name: Create the environment with set_up.py
        run: python set_up.py

      - name: Run short samples
        run: |
          .venv/bin/python main.py --no_HJ --which_planets wasp12b
          .venv/bin/python main.py --no_HJ --which_planets hd209458b
          .venv/bin/python main.py --no_HJ --which_planets seidel26

      - name: Check the Python interface (hj_model.py) against the committed outputs
        run: .venv/bin/python hj_model.py

      - name: Run the example of the README (example.py)
        run: .venv/bin/python example.py

      - name: Compare with the committed outputs
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The outputs differ from the committed files:"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "The outputs match the committed files."
